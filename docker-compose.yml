# TEKIJIN full local stack: db + backend + frontend, one `docker compose up`.
#
# LLM serving is NOT included here: the backend defaults to the deterministic
# "stub" LLM backend (no vLLM needed to try the app). Point it at a real vLLM
# server via TEKIJIN_LLM_BASE_URL / TEKIJIN_LLM_BACKEND=vllm if you have one
# (default base URL: http://internship-dgx1:8080/v1).
#
# First boot downloads the dense embedding model (a few GB) unless you mount
# your existing Hugging Face cache — see `backend`'s volumes below.
#
# FOR AN ISOLATED LOCAL MACHINE ONLY — do not run this on the shared DGX. That
# host runs other teams' containers plus our own hand-created `tekijin_vllm` /
# `tekijin_app_pg`, and everyone is expected to use unique container names and
# ports there (docs/gpu-server-setup.md). The deploy pipeline does not use
# Compose at all (deploy/deploy.sh).
#
# `name:` pins the Compose project instead of letting it default to the checkout
# directory's basename. Without it, two checkouts that happen to share a basename
# (e.g. two `TEKIJIN/` clones on one host) resolve to the SAME project, and a
# `docker compose down` in one silently tears down the other's containers —
# Compose matches on the project label, not the working directory.
name: tekijin-local

services:
  db:
    # Pinned, not `:pg16` (#101). That tag floats to whatever pgvector release is
    # current for PG16, so an upstream bump would change the database under CI and
    # local development with no commit here to blame it on. It also has to stay
    # >= 0.7 for `halfvec`, which #101 needs before an ANN index can be built at
    # 2048 dimensions. `backend/tests/test_pgvector_image_pin.py` holds both rules,
    # and requires this tag and the one in `.github/workflows/test.yml` to match.
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: tekijin
      POSTGRES_PASSWORD: tekijin
      POSTGRES_DB: tekijin
    ports:
      # Bind to loopback only: avoids exposing the weak dev password on the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - tekijin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tekijin -d tekijin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    # Loads every TEKIJIN_* value from the repo-root .env (Slack App
    # credentials, an alternate LLM endpoint, etc.) — without this, only the
    # `environment:` keys below ever reached the container, so .env.example's
    # own instructions for those settings silently did nothing under Compose.
    # `required: false`: .env is gitignored and optional (the app runs on
    # defaults without one), so a fresh checkout without it must not fail here.
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides .env: must point at the `db` service's in-network hostname
      # (not localhost, and not whatever TEKIJIN_DATABASE_URL is set to for
      # host-side tooling like `make migrate`). `environment:` wins over
      # `env_file:` for the same key, so this is safe to also list in .env.
      TEKIJIN_DATABASE_URL: postgresql+psycopg://tekijin:tekijin@db:5432/tekijin
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Reuse an already-downloaded embedding model instead of re-fetching it.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # Fixtures for `docker compose exec backend python -m tekijin.data.seed`
      # (only needed once, on a fresh `tekijin_pgdata` volume).
      - ./fixtures/synthetic:/app/fixtures/synthetic:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time — must be reachable from
        # the USER's browser (the backend's published host port), never the
        # in-network service name `backend`.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  tekijin_pgdata:
