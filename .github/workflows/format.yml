name: Format Check

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/format.yml"
      - ".github/actions/**"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/format.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      makefile: ${{ steps.filter.outputs.makefile }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/format.yml'
              - '.github/actions/setup-backend/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/format.yml'
              - '.github/actions/setup-frontend/**'
            makefile:
              - 'Makefile'

  makefile:
    name: Makefile Check
    needs: changes
    if: needs.changes.outputs.makefile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make help

  backend:
    name: Backend Format Check
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - run: make fmt-check-backend

  frontend:
    name: Frontend Format Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: make fmt-check-frontend
