name: Test

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "Makefile"
      # #101: the pgvector image pin lives here AND in docker-compose.yml, and
      # `test_pgvector_image_pin.py` requires them to agree. A compose-only PR has
      # to start this workflow, or the guard is unreachable exactly when it matters
      # — the same shape as the Makefile-only hole in #309.
      - "docker-compose.yml"
      # #76: `test_single_worker_pin.py` reads deploy/start_backend.sh (the launch
      # path systemd and deploy.sh both exec). A deploy-only PR — "bump --workers
      # for throughput" is exactly that shape — must start this workflow, or the
      # guard is unreachable when it matters. Same hole as Makefile-only in #309.
      - "deploy/**"
      - ".github/workflows/test.yml"
      - ".github/actions/**"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Makefile"
      # #101: the pgvector image pin lives here AND in docker-compose.yml, and
      # `test_pgvector_image_pin.py` requires them to agree. A compose-only PR has
      # to start this workflow, or the guard is unreachable exactly when it matters
      # — the same shape as the Makefile-only hole in #309.
      - "docker-compose.yml"
      # #76: `test_single_worker_pin.py` reads deploy/start_backend.sh (the launch
      # path systemd and deploy.sh both exec). A deploy-only PR — "bump --workers
      # for throughput" is exactly that shape — must start this workflow, or the
      # guard is unreachable when it matters. Same hole as Makefile-only in #309.
      - "deploy/**"
      - ".github/workflows/test.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              # Starting the workflow is not enough: without these the backend job
              # is skipped and the run is green having tested nothing (#309).
              # `Makefile` was in this workflow's `paths:` but in NEITHER filter, so
              # a Makefile-only PR — the file that defines `test-backend` — has been
              # doing exactly that.
              - 'docker-compose.yml'
              - 'Makefile'
              # #76: single-worker pin, see the trigger `paths:` above.
              - 'deploy/**'
              - '.github/workflows/test.yml'
              - '.github/actions/setup-backend/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/test.yml'
              - '.github/actions/setup-frontend/**'

  backend:
    name: Backend Test
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      db:
        # Pinned to match docker-compose.yml (#101); `:pg16` floats. See
        # backend/tests/test_pgvector_image_pin.py — it fails if these drift apart.
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: tekijin
          POSTGRES_PASSWORD: tekijin
          POSTGRES_DB: tekijin
          # CI-only: trust host auth so the ephemeral service accepts the
          # connection regardless of scram password negotiation quirks.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          # Map to host 5433 to avoid clashing with the runner's pre-installed
          # PostgreSQL on 5432 (which has no `tekijin` role → auth failures).
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tekijin -d tekijin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEKIJIN_DATABASE_URL: postgresql+psycopg://tekijin:tekijin@localhost:5433/tekijin
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - run: make test-backend

  frontend:
    name: Frontend Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: make test-frontend

  e2e:
    name: Frontend E2E
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - name: Install Playwright browser (chromium)
        shell: bash
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run E2E
        run: make e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
