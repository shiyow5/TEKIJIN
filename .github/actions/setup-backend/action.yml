name: Setup Backend
description: Set up Python and install backend dev tooling

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version-file: backend/.python-version
        cache: pip

    - name: Install backend runtime + dev dependencies
      shell: bash
      run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
