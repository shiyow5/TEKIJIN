# TEKIJIN backend — tooling config.
# Configures the formatter (ruff), linter (ruff), and test runner (pytest + coverage).

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible default rule set. Adjust when the spec lands.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["tekijin"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=tekijin --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["tekijin"]
omit = [
    # uvicorn entry point — instantiation is covered, no runtime branch to test.
    "src/tekijin/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"

# pgvector ships no type stubs; don't fail type-checking on its imports.
[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true
